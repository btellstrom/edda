# cargo-deny: what the dependencies may be. CI runs `cargo deny check`.

[graph]
all-features = true

[advisories]
# Known vulnerabilities fail the check, as does depending on a yanked
# release; unmaintained crates are reported as warnings.
yanked = "deny"
unmaintained = "workspace"

[licenses]
# Permissive licences only, compatible with this project's MIT OR
# Apache-2.0. A crate offering several (MIT OR LGPL) passes on any of them.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# Two versions of one crate cost build time; worth knowing, not failing.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
