[package]
name = "campaign-client"
version = "0.1.0"
edition = "2024"

[dependencies]
campaign-types = { version = "0.1.0", path = "../campaign-types" }
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
uuid = "1.28.0"

[dev-dependencies]
axum = "0.8.9"
character-service = { path = "../character-service" }
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio"] }
tokio = { version = "1.53.3", features = ["macros", "net", "rt", "rt-multi-thread"] }
