[package]
name = "campaign-client"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
campaign-auth = { version = "0.1.0", path = "../campaign-auth" }
campaign-types = { version = "0.1.0", path = "../campaign-types" }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink"], optional = true }
reqwest = { version = "0.13.5", features = ["json", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["time"] }
tokio-tungstenite = { version = "0.30.0", optional = true, features = ["rustls-tls-native-roots"] }
uuid = "1.28.0"

[features]
default = ["websocket"]
# Live combat updates. Native only; a WASM frontend would use the browser's
# WebSocket with the same messages and the (IO-free) Replica.
websocket = ["dep:tokio-tungstenite", "dep:futures-util", "tokio/net"]

[dev-dependencies]
campaign-server = { path = "../campaign-server", features = ["testing"] }
auth-service = { path = "../auth-service" }
axum = "0.8.9"
campaign-auth = { path = "../campaign-auth", features = ["server"] }
character-service = { path = "../character-service" }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
combat-service = { path = "../combat-service" }
monster-service = { path = "../monster-service" }
reqwest = { version = "0.13.5", features = ["json"] }
tokio = { version = "1.53.3", features = ["macros", "net", "rt", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
