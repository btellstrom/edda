[package]
name = "edda-server"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "What every edda service shares"

[features]
# Databases for tests, on a throwaway Postgres.
testing = ["dep:uuid", "tokio/sync"]

[dependencies]
axum = "0.8.9"
edda-auth = { version = "0.1.0", path = "../edda-auth" }
edda-client = { version = "0.1.0", path = "../edda-client", default-features = false }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "migrate"] }
tokio = { version = "1.53.3", features = ["net", "signal"] }
tower-http = { version = "0.7.1", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.28.0", features = ["v4"], optional = true }

[dev-dependencies]
tokio = { version = "1.53.3", features = ["macros", "rt"] }
tower = { version = "0.5.3", features = ["util"] }

[lints]
workspace = true
