[package]
name = "campaign-server"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "What every campaign-manager service shares"

[features]
# For the services that keep their data in SQLite.
sqlite = ["dep:sqlx"]

[dependencies]
axum = "0.8.9"
campaign-auth = { version = "0.1.0", path = "../campaign-auth" }
campaign-client = { version = "0.1.0", path = "../campaign-client", default-features = false }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite"], optional = true }
tokio = { version = "1.53.3", features = ["net", "signal"] }
tower-http = { version = "0.7.1", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints]
workspace = true
