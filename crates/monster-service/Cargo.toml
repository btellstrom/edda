[package]
name = "monster-service"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
axum = "0.8.9"
edda-auth = { version = "0.1.0", path = "../edda-auth", features = ["server", "openapi"] }
edda-server = { version = "0.1.0", path = "../edda-server" }
edda-types = { version = "0.1.0", path = "../edda-types", features = ["openapi"] }
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "json", "migrate", "macros", "chrono", "uuid"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "signal"] }
utoipa = { version = "6.0.0", features = ["chrono", "uuid"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }

[dev-dependencies]
edda-server = { path = "../edda-server", features = ["testing"] }
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }

[lints]
workspace = true
