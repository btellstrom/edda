[package]
name = "auth-service"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
edda-auth = { version = "0.1.0", path = "../edda-auth", features = ["server"] }
edda-server = { version = "0.1.0", path = "../edda-server" }
edda-types = { version = "0.1.0", path = "../edda-types" }
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
rand = "0.10.3"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "chrono", "uuid", "json"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.7.1", features = ["trace"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }

[lints]
workspace = true
