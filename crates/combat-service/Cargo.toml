[package]
name = "combat-service"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
edda-auth = { version = "0.1.0", path = "../edda-auth", features = ["server", "openapi"] }
edda-client = { version = "0.1.0", path = "../edda-client", default-features = false }
edda-server = { version = "0.1.0", path = "../edda-server" }
edda-types = { version = "0.1.0", path = "../edda-types", features = ["openapi"] }
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock"] }
futures-util = { version = "0.3.34", default-features = false }
metrics = "0.24.6"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "chrono", "uuid", "json"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
utoipa = { version = "6.0.0", features = ["chrono", "uuid"] }
uuid = { version = "1.28.0", features = ["v4", "v5", "serde"] }

[dev-dependencies]
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
tokio-tungstenite = "0.30.0"

[lints]
workspace = true
