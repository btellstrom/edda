[package]
name = "campaign-edit"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
campaign-auth = { version = "0.1.0", path = "../campaign-auth" }
campaign-client = { version = "0.1.0", path = "../campaign-client" }
campaign-types = { version = "0.1.0", path = "../campaign-types" }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-util = "0.3.34"
rand = "0.10.3"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt", "macros", "time", "sync"] }
uuid = "1.28.0"
