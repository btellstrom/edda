[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
license = "MIT OR Apache-2.0"

# Every crate opts in with `[lints] workspace = true`; CI runs clippy with
# warnings as errors.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# The strict lints, but for three that would only add noise here: error
# types are documented enums, and nearly every getter "could" be must_use.
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# `push_str(&format!(..))` reads as plainly as `write!` and can't fail.
format_push_string = "allow"
# Panics belong to tests (clippy.toml allows them there); elsewhere errors
# are returned, and `expect` says why something can't fail.
unwrap_used = "warn"
# Numbers that silently change.
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"

# Release builds (the server image, `make client` and `make install`) are
# made small: whole-program optimisation in one unit, and no symbols. That
# makes the binaries about 40% smaller, and a release build from scratch
# about 45 seconds slower. A crash's backtrace then shows addresses, not
# function names.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
