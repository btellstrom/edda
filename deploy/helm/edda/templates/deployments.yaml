{{- range $service, $config := .Values.services }}
{{- $selector := include "edda.selector" (dict "root" $ "service" $service) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "edda.fullname" $ }}-{{ $service }}
  labels:
    {{- include "edda.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $service }}
spec:
  {{- if not $.Values.autoscaling.enabled }}
  replicas: {{ $config.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- $selector | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "edda.labels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $service }}
      {{- if $.Values.metrics.enabled }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ $.Values.metrics.port | quote }}
        prometheus.io/path: /metrics
      {{- end }}
    spec:
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ $service }}
          image: {{ include "edda.image" $ }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: {{ include "edda.command" $service }}
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          env:
            {{- include "edda.env" (dict "root" $ "service" $service) | nindent 12 }}
            {{- if eq $service "auth" }}
            {{- if $.Values.auth.tokenKeySecret }}
            - name: TOKEN_KEY_FILE
              value: /keys/token.key
            {{- end }}
            {{- end }}
            {{- if eq $service "combat" }}
            - name: SERVICE_KEY_FILE
              value: /keys/combat-service.key
            - name: CHARACTER_SERVICE_URL
              value: {{ include "edda.url" (dict "root" $ "service" "characters") | quote }}
            - name: MONSTER_SERVICE_URL
              value: {{ include "edda.url" (dict "root" $ "service" "monsters") | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ $config.port }}
            {{- if $.Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ $.Values.metrics.port }}
            {{- end }}
            {{- if $.Values.admin.tokenSecret }}
            - name: admin
              containerPort: {{ $.Values.admin.port }}
            {{- end }}
          # Running: restarted if not. Ready (its database answers): sent
          # requests while it is.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            failureThreshold: 2
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 60
          resources:
            {{- toYaml $config.resources | nindent 12 }}
          {{- $keys := or (eq $service "combat") (and (eq $service "auth") $.Values.auth.tokenKeySecret) }}
          {{- if $keys }}
          volumeMounts:
            - name: keys
              mountPath: /keys
              readOnly: true
          {{- end }}
      {{- if $keys }}
      volumes:
        - name: keys
          secret:
            secretName: {{ ternary $.Values.combat.keySecret $.Values.auth.tokenKeySecret (eq $service "combat") }}
      {{- end }}
{{- end }}
