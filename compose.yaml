# Postgres for the combat service (and its tests): `podman compose up -d`
# or `docker compose up -d`. The service creates its databases on first
# start.
services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s

volumes:
  postgres-data:
