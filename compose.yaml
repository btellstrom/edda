# The stack is named edda whatever the directory is called, so its volumes
# are edda_postgres-data and so on; COMPOSE_PROJECT_NAME (or -p) picks
# another, as the smoke test does.
name: edda

# The servers: `podman compose up -d --build` (or `docker compose`).
# Postgres alone, e.g. for the tests: `podman compose up -d postgres`.
# The clients (edda) run natively.
#
# Published on localhost only; change the host side of `ports` (or set the
# *_PORT variables) to move them. To let players' devices in, put HTTPS in
# front with the `https` profile (the proxy below) rather than opening the
# services themselves.

# Every service keeps limits on how much one client or campaign may ask
# of it (see docs/hosting.md); `LIMITS=off` (say, in a .env file) turns them off
# on your own machine. They trust the proxy's word for where a request
# came from, as only it and the other services reach them.
x-app: &app
  build:
    context: .
    # Builds on the host's network, so fetching crates uses the host's
    # resolver even where the engine's own DNS can't reach it (e.g. Docker
    # with systemd-resolved's local stub).
    network: host
  # The Makefile's IMAGE; the smoke test builds one of its own.
  image: ${IMAGE:-localhost/edda}
  restart: unless-stopped

services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      # A first start sets up the database before it accepts connections,
      # which takes a while on a busy machine.
      start_period: 30s
      retries: 10
    restart: unless-stopped

  auth:
    <<: *app
    command: ["auth-service", "serve"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/auth
      BIND_ADDR: 0.0.0.0:3002
      LIMITS: ${LIMITS:-on}
      TRUST_PROXY: "1"
    ports:
      - "127.0.0.1:${AUTH_PORT:-3002}:3002"
    depends_on:
      postgres:
        condition: service_healthy

  # Runs once: creates the combat service's key and lets it log in to every
  # campaign, so it can write hit points back to character sheets.
  register-combat:
    <<: *app
    restart: "no"
    command:
      - sh
      - -c
      - auth-service add-service combat-service "$$(combat-service public-key)"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/auth
      SERVICE_KEY_FILE: /data/combat-service.key
    volumes:
      - combat-data:/data
    depends_on:
      postgres:
        condition: service_healthy

  characters:
    <<: *app
    command: ["character-service"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/characters
      BIND_ADDR: 0.0.0.0:3000
      LIMITS: ${LIMITS:-on}
      TRUST_PROXY: "1"
      AUTH_SERVICE_URL: http://auth:3002
    ports:
      - "127.0.0.1:${CHARACTERS_PORT:-3000}:3000"
    # Where the service kept its data in SQLite, for `make migrate-sqlite`.
    volumes:
      - characters-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_started

  # Runs on every start: loads the monsters, spells and conditions in
  # data/monsters/, data/spells/ and data/conditions/ (the SRD, from
  # `make srd`) into the shared library, updating any already there.
  seed-monsters:
    <<: *app
    restart: "no"
    command:
      - sh
      - -c
      - |
        set -e
        for kind in monsters spells conditions; do
          set -- /srd/$$kind/*.json
          if [ -e "$$1" ]; then
            monster-service import --kind $$kind "$$@"
          else
            echo "No $$kind in data/$$kind/; run make srd to get the SRD's."
          fi
        done
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/monsters
    volumes:
      - ./data/monsters:/srd/monsters:ro
      - ./data/spells:/srd/spells:ro
      - ./data/conditions:/srd/conditions:ro
    depends_on:
      postgres:
        condition: service_healthy

  monsters:
    <<: *app
    command: ["monster-service", "serve"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/monsters
      BIND_ADDR: 0.0.0.0:3003
      LIMITS: ${LIMITS:-on}
      TRUST_PROXY: "1"
      AUTH_SERVICE_URL: http://auth:3002
    ports:
      - "127.0.0.1:${MONSTERS_PORT:-3003}:3003"
    # Where the service kept its data in SQLite, for `make migrate-sqlite`.
    volumes:
      - monsters-data:/data
    depends_on:
      auth:
        condition: service_started
      seed-monsters:
        condition: service_completed_successfully

  combat:
    <<: *app
    command: ["combat-service"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/combats
      BIND_ADDR: 0.0.0.0:3001
      LIMITS: ${LIMITS:-on}
      TRUST_PROXY: "1"
      AUTH_SERVICE_URL: http://auth:3002
      CHARACTER_SERVICE_URL: http://characters:3000
      MONSTER_SERVICE_URL: http://monsters:3003
      SERVICE_KEY_FILE: /data/combat-service.key
    ports:
      - "127.0.0.1:${COMBAT_PORT:-3001}:3001"
    volumes:
      - combat-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      register-combat:
        condition: service_completed_successfully
      auth:
        condition: service_started

  # HTTPS in front of everything, on one address (proxy/Caddyfile), for
  # players' devices on the network: `make up HTTPS=1 EDDA_HOST=...`.
  # Unprivileged ports by default (rootless Podman can't bind 443); point
  # your router's 443 at HTTPS_PORT for a real domain.
  proxy:
    image: docker.io/library/caddy:2.10-alpine
    profiles: ["https"]
    environment:
      EDDA_HOST: ${EDDA_HOST:-localhost}
    ports:
      - "${HTTPS_PORT:-8443}:443"
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - proxy-data:/data
      - proxy-config:/config
    depends_on:
      - auth
      - characters
      - combat
      - monsters
    restart: unless-stopped

volumes:
  postgres-data:
  characters-data:
  combat-data:
  monsters-data:
  proxy-data:
  proxy-config:
