# Every push to master and every pull request. The same checks run locally
# with `make check`, `make deny` and `make smoke`.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format and lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rustup reads rust-toolchain.toml and installs that Rust.
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # The Claude Code hook keeping experiments off a real stack.
      - run: python3 -I .claude/hooks/guard.py --self-test
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The docs build without broken links (Pages publishes them).
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: Tests and coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain && rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - uses: ./.github/actions/srd
      # The tests run in parallel, each with services of its own and their
      # connection pools: more than Postgres's default 100 connections. A
      # service container takes no arguments, so it's set and restarted.
      - name: Give Postgres room for the tests
        run: |
          id=$(docker ps --quiet --filter ancestor=postgres:17-alpine)
          docker exec "$id" psql -U postgres -c "ALTER SYSTEM SET max_connections = 500"
          docker restart "$id"
          until docker exec "$id" pg_isready -U postgres; do sleep 1; done
      # Every test, the SRD ones included, measuring what they cover.
      - run: cargo llvm-cov --workspace --locked --lcov --output-path lcov.info -- --include-ignored
      - name: Coverage summary
        run: |
          echo '## Coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cargo llvm-cov report --summary-only >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      # Coverage may only go up: raise COVERAGE_FLOOR in the Makefile as it
      # does, never lower it.
      - name: Coverage floor
        run: cargo llvm-cov report --fail-under-lines "$(make -s coverage-floor)"
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: lcov.info

  dependencies:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Licences, security advisories, yanked crates and sources (deny.toml).
      - uses: EmbarkStudios/cargo-deny-action@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      # Dependencies nothing uses.
      - run: cargo machete

  smoke:
    name: End to end
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/srd
      - run: cargo build --release --locked -p edda
      - run: tools/smoke-test.sh
        env:
          CONTAINER: docker

  kubernetes:
    name: Kubernetes
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      # kind only; the test makes its own cluster. Helm and kubectl are on
      # the runner already.
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - run: helm lint deploy/helm/edda
      - name: The chart's manifests, all options on, as Kubernetes reads them
        run: |
          base=https://github.com/yannh/kubeconform/releases/download/v0.8.0
          curl -fsSLO "$base/kubeconform-linux-amd64.tar.gz"
          curl -fsSL "$base/CHECKSUMS" | grep 'kubeconform-linux-amd64.tar.gz$' | sha256sum -c
          tar -xzf kubeconform-linux-amd64.tar.gz kubeconform
          helm template edda deploy/helm/edda --set ingress.enabled=true \
              --set ingress.host=dnd.example.com --set admin.tokenSecret=edda-admin \
              --set auth.tokenKeySecret=edda-token-key --set autoscaling.enabled=true \
              --set database.direct=true | ./kubeconform -strict -summary
      - run: cargo build --release --locked -p edda
      - run: tools/kind-test.sh
        env:
          CONTAINER: docker
